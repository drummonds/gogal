type: library
check: [task check]
changelog_format: keepachangelog
pages_build:
    - task docs:screenshots
    - task docs:build-wasm
    - task docs:build
pages_deploy:
    - type: rsync
      site: gogal
remotes:
    - name: origin
      forge: forgejo
      token_env: BYTESTONE_FORGEJO_TOKEN
    - name: github
      forge: github
